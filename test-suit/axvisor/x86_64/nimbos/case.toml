arch = "x86_64"
guest = "nimbos"
scheme = "axvisor-x86_64"
image = "qemu_x86_64_nimbos"
timeout_secs = 240
success_regex = ["(?m)^usertests passed!\\s*$"]
fail_regex = [
  "System will reboot, press any key to continue \\.\\.\\.",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)permission denied",
]
shell_prompt = ">> "
shell_init_cmd = "usertests"
extra_qemu_args = [
  "-smp",
  "2",
  "-device",
  "virtio-blk-pci,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file={guest_dir}/rootfs.img",
]
