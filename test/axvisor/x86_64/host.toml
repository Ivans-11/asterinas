scheme = "axvisor-x86_64"
features = ["axvisor"]
host_qemu_args = [
  "-machine",
  "q35,kernel-irqchip=split",
  "-enable-kvm",
  "-cpu",
  "host",
  "-smp",
  "2",
  "-m",
  "8G",
  "--no-reboot",
  "-nographic",
  "-display",
  "none",
  "-serial",
  "chardev:mux",
  "-monitor",
  "chardev:mux",
  "-chardev",
  "stdio,id=mux,mux=on,signal=off,logfile=qemu.log",
  "-device",
  "isa-debug-exit,iobase=0xf4,iosize=0x04",
]
