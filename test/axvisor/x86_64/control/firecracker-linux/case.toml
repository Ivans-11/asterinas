arch = "x86_64"
case = "firecracker-linux"
image = "qemu_x86_64_linux"
payload_files = ["vmlinux", "initramfs.cpio.gz", "rootfs.img"]
payload_extract_bzimage_elf = [
  { source = "qemu-x86_64", output = "vmlinux" },
]
timeout_secs = 600
success_regex = ["(?m)^firecracker guest test pass!\\s*$"]
fail_regex = [
  "(?i)uncaught panic",
  "(?i)panicked at",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?i)Firecracker exiting with error",
  "(?i)RunWithApiError",
  "(?i)StartMicrovm",
  "(?i)KVM_.*failed",
  "(?i)firecracker payload mount failed",
]
extra_qemu_args = [
  "-drive",
  "if=none,format=raw,id=firecracker_linux_payload,file={control_payload_image}",
  "-device",
  "virtio-blk-pci,bus=pcie.0,addr=0x6,drive=firecracker_linux_payload,serial=vaxvisorfc,disable-legacy=on,disable-modern=off,queue-size=64,num-queues=1,request-merging=off,backend_defaults=off,discard=off,write-zeroes=off,event_idx=off,indirect_desc=off,queue_reset=off",
]

[[interactions]]
expect = "~ # "
send = "umount /ext2 2>/dev/null; (mount -t ext2 /dev/vda /ext2 || { echo firecracker payload mount failed; ls /dev; false; }) && /test/firecracker --no-api --no-seccomp --config-file /test/firecracker-x86_64.json --level Debug"

[[interactions]]
expect = "job control turned off"
send = "cat /proc/cpuinfo;echo firecracker guest test\\ pass!"
