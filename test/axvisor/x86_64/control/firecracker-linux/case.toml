arch = "x86_64"
case = "firecracker-linux"
image = "qemu_x86_64_linux"
payload_files = ["qemu-x86_64", "initramfs.cpio.gz", "rootfs.img"]
timeout_secs = 600
success_regex = ["(?m)^firecracker guest test pass!\\s*$"]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?i)unable to",
  "(?i)Firecracker exiting with error",
  "(?i)RunWithApiError",
  "(?i)StartMicrovm",
  "(?i)KVM_.*failed",
]
extra_qemu_args = [
  "-drive",
  "if=none,format=raw,id=firecracker_linux_payload,file={control_payload_image}",
  "-device",
  "virtio-blk-pci,drive=firecracker_linux_payload,addr=04.0",
]

[[interactions]]
expect = "~ # "
send = "umount /ext2 2>/dev/null; mount -t ext2 /dev/vda /ext2 && /test/firecracker --no-api --no-seccomp --config-file /test/firecracker-x86_64.json --level Debug"

[[interactions]]
expect = "job control turned off"
send = "cat /proc/cpuinfo;ls /proc;echo firecracker guest test\\ pass!"
