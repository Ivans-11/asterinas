arch = "riscv64"
case = "firecracker-linux"
image = "qemu_riscv64_linux"
payload_files = ["qemu-riscv64", "initramfs.cpio.gz", "rootfs.img"]
timeout_secs = 600
success_regex = ["(?m)^firecracker guest test pass!\\s*$"]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?i)unable to",
  "(?i)Firecracker exiting with error",
  "(?i)RunWithApiError",
  "(?i)StartMicrovm",
  "(?i)KVM_.*failed",
]
extra_qemu_args = [
  "-drive",
  "if=none,format=raw,id=firecracker_linux_payload,file={control_payload_image}",
  "-device",
  "virtio-blk-device,drive=firecracker_linux_payload",
]

[[interactions]]
expect = "~ # "
send = "umount /ext2 2>/dev/null; mount -t ext2 /dev/vda /ext2 && /test/firecracker --no-api --no-seccomp --config-file /test/firecracker-riscv.json --level Debug"

[[interactions]]
expect = "~ # "
send = "/bin/busybox mount -t proc proc /proc 2>/dev/null || true; n=$(/bin/busybox grep -c '^processor' /proc/cpuinfo); test \"$n\" -ge 4 && echo 'firecracker guest test pass!'"
