arch = "riscv64"
guest = "linux"
image = "qemu_riscv64_linux"
timeout_secs = 180
success_regex = ["(?m)^guest test pass!\\s*$"]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
]
shell_prompt = "~ # "
shell_init_cmd = "/bin/busybox mount -t proc proc /proc 2>/dev/null || true; n=$(/bin/busybox grep -c '^processor' /proc/cpuinfo); /bin/busybox ip link set eth0 up && /bin/busybox ip addr add 10.0.2.15/24 dev eth0 && /bin/busybox ping -c 3 -W 3 10.0.2.2 && test \"$n\" -ge 4 && echo 'guest test pass!'"
extra_qemu_args = [
  "-drive",
  "if=none,format=raw,id=axvisor_guest_rootfs,file={guest_dir}/rootfs.img",
  "-device",
  "virtio-blk-device,drive=axvisor_guest_rootfs",
  "-netdev",
  "user,id=axvisor_guest_net",
  "-device",
  "virtio-net-device,netdev=axvisor_guest_net,mac=06:00:ac:10:00:02",
]
