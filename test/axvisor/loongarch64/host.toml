scheme = "axvisor-loongarch64"
features = ["axvisor"]
host_qemu_args = [
  "-machine",
  "virt",
  "-m",
  "8G",
  "-smp",
  "1",
  "--no-reboot",
  "-nographic",
  "-display",
  "none",
  "-serial",
  "chardev:mux",
  "-monitor",
  "chardev:mux",
  "-chardev",
  "stdio,id=mux,mux=on,signal=off,logfile=qemu.log",
  "-device",
  "virtio-keyboard-pci",
  "-device",
  "virtio-serial",
  "-device",
  "virtconsole,chardev=mux",
  "-rtc",
  "base=utc",
]
