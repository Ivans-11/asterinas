name: "Test Axvisor"

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  axvisor-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: asterinas/asterinas:0.17.2-20260523
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            mode: static
            guest: nimbos
            case: ""
            name: x86_64-static-nimbos
          - arch: x86_64
            mode: static
            guest: linux
            case: ""
            name: x86_64-static-linux
          - arch: x86_64
            mode: control
            guest: ""
            case: smoke
            name: x86_64-control-smoke
          - arch: x86_64
            mode: control
            guest: ""
            case: firecracker-linux
            name: x86_64-control-firecracker-linux
          - arch: x86_64
            mode: control
            guest: ""
            case: qemu-linux
            name: x86_64-control-qemu-linux
          - arch: x86_64
            mode: control
            guest: ""
            case: sandbox
            name: x86_64-control-sandbox
          - arch: riscv64
            mode: static
            guest: arceos
            case: ""
            name: riscv64-static-arceos
          - arch: riscv64
            mode: static
            guest: linux
            case: ""
            name: riscv64-static-linux
          - arch: riscv64
            mode: control
            guest: ""
            case: smoke
            name: riscv64-control-smoke
          - arch: riscv64
            mode: control
            guest: ""
            case: sandbox
            name: riscv64-control-sandbox
          - arch: riscv64
            mode: control
            guest: ""
            case: lkvm-linux
            name: riscv64-control-lkvm-linux
          - arch: riscv64
            mode: control
            guest: ""
            case: firecracker-linux
            name: riscv64-control-firecracker-linux
          - arch: riscv64
            mode: control
            guest: ""
            case: qemu-linux
            name: riscv64-control-qemu-linux
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*

      - uses: actions/checkout@v4

      - name: Enable KVM for x86 Axvisor
        if: matrix.arch == 'x86_64'
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner"
            exit 1
          fi
          groupadd -f kvm
          chgrp kvm /dev/kvm || true
          chmod g+rw /dev/kvm || true
          usermod -aG kvm "$(id -un)"
          ls -l /dev/kvm

      - name: Run Axvisor test (${{ matrix.name }})
        run: |
          if [ "${{ matrix.mode }}" = "static" ]; then
            cmd="./tools/axvisor test --arch '${{ matrix.arch }}' --mode static --guest '${{ matrix.guest }}'"
          else
            cmd="./tools/axvisor test --arch '${{ matrix.arch }}' --mode control --case '${{ matrix.case }}'"
          fi

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            sg kvm -c "$cmd"
          else
            eval "$cmd"
          fi

      - name: Upload Axvisor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axvisor-logs-${{ matrix.name }}
          path: target/axvisor/logs/
          if-no-files-found: ignore
