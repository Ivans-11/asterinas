name: "Test Axvisor"

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  axvisor-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/asterinas:0.17.2-20260523
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            guest: nimbos
          - arch: riscv64
            guest: arceos
          - arch: riscv64
            guest: linux
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*

      - uses: actions/checkout@v4

      - name: Enable KVM for x86 Axvisor
        if: matrix.arch == 'x86_64'
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner"
            exit 1
          fi
          groupadd -f kvm
          chgrp kvm /dev/kvm || true
          chmod g+rw /dev/kvm || true
          usermod -aG kvm "$(id -un)"
          ls -l /dev/kvm

      - name: Run Axvisor test (${{ matrix.arch }}/${{ matrix.guest }})
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            sg kvm -c "./tools/axvisor test --arch '${{ matrix.arch }}' --guest '${{ matrix.guest }}'"
          else
            ./tools/axvisor test --arch "${{ matrix.arch }}" --guest "${{ matrix.guest }}"
          fi

      - name: Upload Axvisor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axvisor-logs-${{ matrix.arch }}-${{ matrix.guest }}
          path: target/axvisor/logs/
          if-no-files-found: ignore
